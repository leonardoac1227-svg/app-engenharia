<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Entrar · Obra ERP</title>
<meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/img/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="stylesheet" href="/static/v{{ versao_app }}/css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-marca">
      <div class="marca-selo"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.8"/><path d="M9.5 21v-6h5v6"/></svg></div>
      <span class="eyebrow">DIÁRIO DE CANTEIRO</span>
      <h1>Obra ERP</h1>
    </div>

    <form id="formLogin" novalidate>
      <label class="field-label" for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="username"
             inputmode="email" placeholder="voce@empresa.com.br" required>

      <label class="field-label" for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password"
             placeholder="••••••••" required>

      <div id="loginErro" class="login-erro hidden"></div>

      <button type="submit" class="btn btn-brass" id="btnEntrar">Entrar</button>
    </form>

    <p class="login-dica">
      Primeiro acesso? Use as credenciais definidas no deploy<br>
      (padrão: <b>gestor@obra.local</b> / <b>obra123</b>) e troque a senha em Ajustes.
    </p>
  </div>
</div>

<script src="/static/v{{ versao_app }}/js/login.js"></script>
</body>
</html>
