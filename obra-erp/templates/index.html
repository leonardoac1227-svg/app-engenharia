<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Obra ERP · Diário de Canteiro</title>
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Obra ERP">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/img/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css?v={{ versao_app }}">
</head>
<body>

<div class="offline-banner" id="bannerOffline">Sem conexão — os dados exibidos podem estar desatualizados</div>

<header class="topbar">
  <button class="icon-btn" id="btnMenu" aria-label="Abrir lista de obras">
    <span class="hamburger"><i></i><i></i><i></i></span>
  </button>
  <div class="topbar-title">
    <span class="eyebrow" id="topbarEyebrow">CANTEIRO</span>
    <h1 id="topbarTitulo">Obra ERP</h1>
  </div>
  <button class="avatar" id="btnPerfil" aria-label="Ajustes e perfil">--</button>
</header>

<!-- DRAWER DE OBRAS -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" aria-label="Obras">
  <div class="drawer-head">
    <span class="eyebrow">CENTROS DE CUSTO</span>
    <h2>Obras</h2>
  </div>
  <div class="drawer-list" id="listaObras"></div>
  <div class="drawer-foot" id="drawerFoot">
    <button class="btn btn-brass" id="btnNovaObra">+ Nova obra</button>
    <button class="btn btn-ghost btn-small" id="btnVerArquivadas" style="width:100%;margin-top:8px">
      Mostrar obras arquivadas
    </button>
  </div>
</aside>

<main class="main" id="main">
  <section class="view" id="viewHome"></section>
  <section class="view hidden" id="viewDiario"></section>
  <section class="view hidden" id="viewEquipe"></section>
  <section class="view hidden" id="viewFinanceiro"></section>
  <section class="view hidden" id="viewTerceirizados"></section>
  <section class="view hidden" id="viewFechamento"></section>
  <section class="view hidden" id="viewAjustes"></section>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tabbar-btn active" data-aba="home">
    <span class="tab-ico"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.8"/><path d="M9.5 21v-6h5v6"/></svg></span>Painel</button>
  <button class="tabbar-btn" data-aba="diario">
    <span class="tab-ico"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span>Diário</button>
  <button class="tabbar-btn" data-aba="equipe">
    <span class="tab-ico"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16.5 5.4a3.2 3.2 0 0 1 0 5.6M18 14.8c2 .8 3.2 2.6 3.2 5.2"/></svg></span>Equipe</button>
  <button class="tabbar-btn" data-aba="financeiro">
    <span class="tab-ico"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/><path d="M6.5 15h3"/></svg></span>Caixa</button>
  <button class="tabbar-btn" data-aba="terceirizados">
    <span class="tab-ico"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6V4.6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V6"/><rect x="2.6" y="6" width="18.8" height="13" rx="2.4"/><path d="M2.6 11.5h18.8"/></svg></span>Terceiros</button>
  <button class="tabbar-btn" data-aba="fechamento">
    <span class="tab-ico"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1Z"/><rect x="4" y="6" width="16" height="15" rx="2.5"/><path d="m9 13.5 2 2 4-4"/></svg></span>Fechar</button>
</nav>

<button class="fab" id="btnFab" aria-label="Novo lançamento">+</button>

<!-- OVERLAYS -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-alca"></div>
    <div id="modalConteudo"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="icon-btn lightbox-fechar" id="lightboxFechar" aria-label="Fechar">✕</button>
  <img id="lightboxImg" alt="Foto do diário de obra">
  <div class="lightbox-info" id="lightboxInfo"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/static/js/app.js?v={{ versao_app }}"></script>
</body>
</html>
