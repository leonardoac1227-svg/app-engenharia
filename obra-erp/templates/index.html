<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Obra ERP · Diário de Canteiro</title>
<meta name="theme-color" content="#0F1214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obra ERP">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/img/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css?v={{ versao_app }}">
</head>
<body>

<div class="offline-banner" id="bannerOffline">Sem conexão — os dados exibidos podem estar desatualizados</div>

<header class="topbar">
  <button class="icon-btn" id="btnMenu" aria-label="Abrir lista de obras">
    <span class="hamburger"><i></i><i></i><i></i></span>
  </button>
  <div class="topbar-title">
    <span class="eyebrow" id="topbarEyebrow">CANTEIRO</span>
    <h1 id="topbarTitulo">Obra ERP</h1>
  </div>
  <button class="avatar" id="btnPerfil" aria-label="Menu do usuário">--</button>
</header>

<!-- DRAWER DE OBRAS -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" aria-label="Obras">
  <div class="drawer-head">
    <span class="eyebrow">CENTROS DE CUSTO</span>
    <h2>Obras</h2>
  </div>
  <div class="drawer-list" id="listaObras"></div>
  <div class="drawer-foot" id="drawerFoot">
    <button class="btn btn-brass" id="btnNovaObra">+ Nova obra</button>
    <button class="btn btn-ghost btn-small" id="btnVerArquivadas" style="width:100%;margin-top:8px">
      Mostrar obras arquivadas
    </button>
  </div>
</aside>

<main class="main" id="main">
  <section class="view" id="viewHome"></section>
  <section class="view hidden" id="viewDiario"></section>
  <section class="view hidden" id="viewEquipe"></section>
  <section class="view hidden" id="viewFinanceiro"></section>
  <section class="view hidden" id="viewFechamento"></section>
  <section class="view hidden" id="viewAjustes"></section>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tabbar-btn active" data-aba="home"><span class="tab-ico">◧</span>Painel</button>
  <button class="tabbar-btn" data-aba="diario"><span class="tab-ico">✎</span>Diário</button>
  <button class="tabbar-btn" data-aba="equipe"><span class="tab-ico">☰</span>Equipe</button>
  <button class="tabbar-btn" data-aba="financeiro"><span class="tab-ico">$</span>Caixa</button>
  <button class="tabbar-btn" data-aba="fechamento"><span class="tab-ico">▤</span>Fechar</button>
</nav>

<!-- OVERLAYS -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-alca"></div>
    <div id="modalConteudo"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="icon-btn lightbox-fechar" id="lightboxFechar" aria-label="Fechar">✕</button>
  <img id="lightboxImg" alt="Foto do diário de obra">
  <div class="lightbox-info" id="lightboxInfo"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/static/js/app.js?v={{ versao_app }}"></script>
</body>
</html>
